[workspace]
[package]
name = "eio-conversacion"
version = "0.2.3"
edition = "2021"
rust-version = "1.98"
publish = false

[[bin]]
name = "eio-conversacion"
path = "src/main.rs"

[dependencies]
opentelemetry = { version = "=0.31.0", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.31.0", default-features = false, features = ["trace"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
axum = { version = "=0.8.8", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.49.0", default-features = false, features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process", "fs", "feature"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }

[profile.release]
debug = 0
incremental = false

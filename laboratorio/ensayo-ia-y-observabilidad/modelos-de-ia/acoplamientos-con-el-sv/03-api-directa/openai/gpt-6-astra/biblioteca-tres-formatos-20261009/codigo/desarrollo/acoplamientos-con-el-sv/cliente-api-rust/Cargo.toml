[package]
name = "sv-cliente-api"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sv-instrumentacion = { path = "../instrumentacion-rust" }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.8.2"
base64 = "=0.22.1"
getrandom = "=0.2.16"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["rust_crypto"] }
subtle = "=2.6.1"
url = "=2.5.8"

[dev-dependencies]
rsa = "=0.9.10"
rand = "=0.8.8"

[profile.dev]
debug = 0

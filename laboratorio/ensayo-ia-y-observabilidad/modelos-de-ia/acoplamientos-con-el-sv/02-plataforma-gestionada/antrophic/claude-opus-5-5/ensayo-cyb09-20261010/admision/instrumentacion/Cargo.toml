[package]
name = "sv-claude-kaggle"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots"] }
zeroize = "=1.8.2"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
netstat2 = "=0.11.2"

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

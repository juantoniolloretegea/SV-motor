[package]
name = "sv-mcp-documental"
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
scraper = "=0.25.0"
html2text = "=0.16.6"

opentelemetry = "=0.31.0"
opentelemetry_sdk = { version = "=0.31.0", features = ["trace"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json"] }

[profile.release]
strip = true


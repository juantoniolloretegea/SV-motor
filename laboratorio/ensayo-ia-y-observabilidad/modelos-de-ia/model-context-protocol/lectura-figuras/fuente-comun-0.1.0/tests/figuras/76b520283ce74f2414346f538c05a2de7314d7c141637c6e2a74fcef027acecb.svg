<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 720" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Gestor del SV y condiciones de integración con el Lenguaje</title>
  <desc id="descripcion">El Gestor administra configuraciones, permisos y fuentes. La presentación muestra los estados sin decidirlos. La relación con el Lenguaje exige tubería, contrato de frontera y admisión. La disponibilidad de las operaciones depende de la versión recibida.</desc>
  <defs><marker id="flecha" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#08758b"/></marker></defs>
  <rect width="860" height="720" rx="16" fill="#f3f7f9"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#14394d">
    <text x="430" y="43" font-size="24" font-weight="700">Responsabilidades y condiciones de integración</text>
    <rect x="50" y="75" width="760" height="115" rx="10" fill="#fff" stroke="#58859b" stroke-width="2"/>
    <text x="430" y="111" font-size="23" font-weight="700">Gestor del Sistema Vectorial SV · Rust</text>
    <text x="430" y="143" font-size="20">Dominios · asignaciones · permisos · documentos</text>
    <text x="430" y="171" font-size="19">Decisiones y actuaciones identificadas por revisión</text>
    <path d="M220 190 V240" fill="none" stroke="#08758b" stroke-width="2" marker-end="url(#flecha)"/>
    <path d="M635 190 V240" fill="none" stroke="#08758b" stroke-width="2" marker-end="url(#flecha)"/>
    <rect x="50" y="245" width="340" height="130" rx="10" fill="#fff" stroke="#58859b" stroke-width="2"/>
    <text x="220" y="281" font-size="22" font-weight="700">Presentación</text>
    <text x="220" y="312" font-size="19">Información autorizada</text>
    <text x="220" y="340" font-size="19">Estado y polígono asociados</text>
    <text x="220" y="362" font-size="17">Sin autoridad sobre el núcleo</text>
    <rect x="430" y="245" width="380" height="130" rx="10" fill="#fff" stroke="#58859b" stroke-width="2"/>
    <text x="620" y="281" font-size="22" font-weight="700">Condiciones de integración</text>
    <text x="620" y="313" font-size="19">Identidad · revisión · permisos</text>
    <text x="620" y="344" font-size="19">Fidelidad · procedencia · límites</text>
    <path d="M620 375 V430 H430 V467" fill="none" stroke="#08758b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
    <rect x="100" y="475" width="660" height="75" rx="10" fill="#e6f1f5" stroke="#58859b" stroke-width="2"/>
    <text x="430" y="507" font-size="22" font-weight="700">Tubería y contrato de frontera</text>
    <text x="430" y="533" font-size="19">Admisión explícita de las entradas</text>
    <path d="M430 550 V580" fill="none" stroke="#08758b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#flecha)"/>
    <rect x="100" y="590" width="660" height="75" rx="10" fill="#fff" stroke="#58859b" stroke-width="2"/>
    <text x="430" y="622" font-size="22" font-weight="700">Lenguaje de Computación SV · Rust</text>
    <text x="430" y="648" font-size="19">Objetos, reglas y operaciones de la versión recibida</text>
    <text x="430" y="697" font-size="17">Trazo discontinuo: recorrido sujeto a contrato y capacidad habilitada.</text>
  </g>
</svg>

[package]
name = "sv-evaluacion-ocr-local"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
ocrs = { version = "=0.13.1", default-features = false, features = ["rten"] }
rten = { version = "=0.26.0", default-features = false, features = ["rten_format"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rustix = { version = "=1.1.5", features = ["process"] }
serde_json = "=1.0.149"

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

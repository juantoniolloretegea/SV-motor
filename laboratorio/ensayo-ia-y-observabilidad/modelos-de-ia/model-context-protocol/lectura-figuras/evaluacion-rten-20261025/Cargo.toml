[package]
name = "sv-evaluacion-rten"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[dependencies]
rten = { version = "=0.27.0", default-features = false }
rten-tensor = "=0.27.0"
serde_json = "=1.0.149"
rustix = { version = "=1.1.5", features = ["process"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true


[package]
name = "sv-helsinki-selector"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.102"
candle = { package = "candle-core", version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
pjrt = { path = "../dependencias/pjrt-rs/pjrt" }
pjrt-sys = { path = "../dependencias/pjrt-rs/pjrt-sys" }
prost = "0.14"
sv-telemetria-cpu-tpu = { path = "../telemetria" }
selector-arbitro-director-cpu-gpu-tpu-npu = { path = ".." }

[build-dependencies]
prost-build = "0.14"

[profile.release]
strip = true

[profile.dev]
debug = 0


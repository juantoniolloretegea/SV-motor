<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="4331" viewBox="0 0 1280 4331" role="img" aria-labelledby="title desc"><title id="title">Vía A · Inferencia en el navegador</title><desc id="desc">Campaña NAV-02: controles NAV01–NAV04 conformes, inferencia NAV05 interrumpida. Flujo secuencial con cinco participantes. Las condiciones y alternativas delimitan los recorridos.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,3 L0,6 Z" fill="#205a7f"/></marker></defs><rect width="1280" height="4331" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="35" y="38" text-anchor="start" fill="#102e44" font-size="25" font-weight="700">Vía A · Inferencia en el navegador</text><text x="35" y="71" text-anchor="start" fill="#526878" font-size="17" font-weight="400">Campaña NAV-02: controles NAV01–NAV04 conformes, inferencia NAV05 interrumpida.</text><path d="M 140 157 V 4283" stroke="#c5d2dc" stroke-dasharray="5 6"/><rect x="30" y="99" width="220" height="43" rx="6" fill="#dceaf3" stroke="#91adc1"/><text x="140.0" y="125" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Operador humano</text><path d="M 390 157 V 4283" stroke="#c5d2dc" stroke-dasharray="5 6"/><rect x="280" y="99" width="220" height="43" rx="6" fill="#dceaf3" stroke="#91adc1"/><text x="390.0" y="125" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Supervisor exterior</text><path d="M 640 157 V 4283" stroke="#c5d2dc" stroke-dasharray="5 6"/><rect x="530" y="99" width="220" height="43" rx="6" fill="#dceaf3" stroke="#91adc1"/><text x="640.0" y="125" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Control y custodia</text><path d="M 890 157 V 4283" stroke="#c5d2dc" stroke-dasharray="5 6"/><rect x="780" y="99" width="220" height="43" rx="6" fill="#dceaf3" stroke="#91adc1"/><text x="890.0" y="125" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Página JavaScript</text><path d="M 1140 157 V 4283" stroke="#c5d2dc" stroke-dasharray="5 6"/><rect x="1030" y="99" width="220" height="43" rx="6" fill="#dceaf3" stroke="#91adc1"/><text x="1140.0" y="125" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Worker Rust/WASM</text><rect x="35" y="182" width="1210" height="43" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="640.0" y="208" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Vía A: arquitectura de la campaña NAV-02 en el ejecutor remoto</text><rect x="146.0" y="249" width="238" height="64" rx="4" fill="white"/><text x="265.0" y="270" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">1. Autoriza la campaña y</text><text x="265.0" y="295" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">sus límites</text><path d="M 140 321 H 390" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="285" y="356" width="460" height="68" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="515.0" y="382" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Preparación previa: código, herramientas y</text><text x="515.0" y="407" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">recursos identificados</text><rect x="396.0" y="448" width="238" height="64" rx="4" fill="white"/><text x="515.0" y="469" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">2. Inicia el controlador de</text><text x="515.0" y="494" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">la campaña</text><path d="M 390 520 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="646.0" y="555" width="238" height="64" rx="4" fill="white"/><text x="765.0" y="576" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">3. Abre Chrome y sirve la</text><text x="765.0" y="601" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">página y los recursos</text><path d="M 640 627 H 890" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="535" y="662" width="210" height="118" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="640.0" y="688" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Controlador Node y</text><text x="640.0" y="713" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">recuperación</text><text x="640.0" y="738" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">exterior de</text><text x="640.0" y="763" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">evidencias</text><rect x="896.0" y="804" width="238" height="89" rx="4" fill="white"/><text x="1015.0" y="825" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">4. Ejecuta controles</text><text x="1015.0" y="850" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">sintéticos NAV01 y</text><text x="1015.0" y="875" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">NAV02</text><path d="M 890 901 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="896.0" y="936" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="957" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">5. Devuelve resultados y</text><text x="1015.0" y="982" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">señales OpenTelemetry</text><path d="M 1140 1008 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="646.0" y="1043" width="238" height="64" rx="4" fill="white"/><text x="765.0" y="1064" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">6. Transmite los registros</text><text x="765.0" y="1089" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">para custodia</text><path d="M 890 1115 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="896.0" y="1150" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="1171" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">7. Ejecuta la sonda no</text><text x="1015.0" y="1196" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">cooperativa NAV03</text><path d="M 890 1222 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="896.0" y="1257" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="1278" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">8. Ordena terminar el</text><text x="1015.0" y="1303" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Worker</text><path d="M 890 1329 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="1364" width="460" height="68" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1015.0" y="1390" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Cierra el canal y rechaza el identificador</text><text x="1015.0" y="1415" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">cancelado</text><rect x="896.0" y="1456" width="238" height="89" rx="4" fill="white"/><text x="1015.0" y="1477" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">9. Crea otro Worker y</text><text x="1015.0" y="1502" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">comprueba una tarea</text><text x="1015.0" y="1527" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">nueva</text><path d="M 890 1553 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="896.0" y="1588" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="1609" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">10. Devuelve el</text><text x="1015.0" y="1634" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">resultado del control</text><path d="M 1140 1660 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="896.0" y="1695" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="1716" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">11. Ejecuta NAV04 con</text><text x="1015.0" y="1741" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">un evento omitido</text><path d="M 890 1767 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="896.0" y="1802" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="1823" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">12. Informa de la</text><text x="1015.0" y="1848" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">omisión</text><path d="M 1140 1874 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="646.0" y="1909" width="238" height="89" rx="4" fill="white"/><text x="765.0" y="1930" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">13. Solicita</text><text x="765.0" y="1955" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">comprobación previa a la</text><text x="765.0" y="1980" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">inferencia</text><path d="M 890 2006 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="396.0" y="2041" width="238" height="64" rx="4" fill="white"/><text x="515.0" y="2062" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">14. Consulta evidencia</text><text x="515.0" y="2087" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">de supervisión activa</text><path d="M 640 2113 H 390" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="396.0" y="2148" width="238" height="64" rx="4" fill="white"/><text x="515.0" y="2169" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">15. Estado y medidas</text><text x="515.0" y="2194" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">disponibles</text><path d="M 390 2220 H 640" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="646.0" y="2255" width="238" height="89" rx="4" fill="white"/><text x="765.0" y="2276" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">16. Confirma custodia y</text><text x="765.0" y="2301" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">habilitación</text><text x="765.0" y="2326" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">instrumental, o rechaza</text><path d="M 640 2352 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M 22 2392 H 1258" stroke="#a9bbc9" stroke-dasharray="5 4"/><rect x="26" y="2397" width="1228" height="43" rx="6" fill="#e8edf2" stroke="#a9bbc9"/><text x="640.0" y="2423" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">CONDICIÓN · Se cumplen los controles previos</text><rect x="896.0" y="2462" width="238" height="64" rx="4" fill="white"/><text x="1015.0" y="2483" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">17. Solicita NAV05 con</text><text x="1015.0" y="2508" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">identidad de tarea</text><path d="M 890 2534 H 1140" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="646.0" y="2569" width="488" height="39" rx="4" fill="white"/><text x="890.0" y="2590" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">18. Solicita WASM, pesos, tokenizador y petición</text><path d="M 1140 2616 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="646.0" y="2651" width="488" height="39" rx="4" fill="white"/><text x="890.0" y="2672" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">19. Sirve los recursos del ensayo</text><path d="M 640 2698 H 1140" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="1035" y="2733" width="210" height="68" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1140.0" y="2759" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Coteja recursos y</text><text x="1140.0" y="2784" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">valida la entrada</text><rect x="1035" y="2825" width="210" height="93" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1140.0" y="2851" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Rust y Candle cargan</text><text x="1140.0" y="2876" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Qwen y realizan la</text><text x="1140.0" y="2901" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">inferencia</text><rect x="896.0" y="2942" width="238" height="89" rx="4" fill="white"/><text x="1015.0" y="2963" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">20. Emite marcas de las</text><text x="1015.0" y="2988" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">operaciones</text><text x="1015.0" y="3013" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">instrumentadas</text><path d="M 1140 3039 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="646.0" y="3074" width="238" height="64" rx="4" fill="white"/><text x="765.0" y="3095" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">21. Remite las marcas</text><text x="765.0" y="3120" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">para persistencia</text><path d="M 890 3146 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 34 3186 H 1246" stroke="#a9bbc9" stroke-dasharray="5 4"/><rect x="38" y="3191" width="1204" height="43" rx="6" fill="#e8edf2" stroke="#a9bbc9"/><text x="640.0" y="3217" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">CONDICIÓN · La inferencia finaliza</text><rect x="1035" y="3256" width="210" height="93" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1140.0" y="3282" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Verifica el contrato y</text><text x="1140.0" y="3307" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">la cobertura de</text><text x="1140.0" y="3332" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">telemetría</text><rect x="896.0" y="3373" width="238" height="89" rx="4" fill="white"/><text x="1015.0" y="3394" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">22. Devuelve salida</text><text x="1015.0" y="3419" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">original, juicio y</text><text x="1015.0" y="3444" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">telemetría</text><path d="M 1140 3470 H 890" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="646.0" y="3505" width="238" height="64" rx="4" fill="white"/><text x="765.0" y="3526" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">23. Remite el resultado</text><text x="765.0" y="3551" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">para custodia</text><path d="M 890 3577 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><path d="M 34 3617 H 1246" stroke="#a9bbc9" stroke-dasharray="5 4"/><rect x="38" y="3622" width="1204" height="43" rx="6" fill="#e8edf2" stroke="#a9bbc9"/><text x="640.0" y="3648" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">ALTERNATIVA · Se detecta exceso en el ensayo</text><rect x="396.0" y="3687" width="238" height="64" rx="4" fill="white"/><text x="515.0" y="3708" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">24. Ordena terminar la</text><text x="515.0" y="3733" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">familia de procesos</text><path d="M 390 3759 H 640" fill="none" stroke="#205a7f" stroke-width="2" marker-end="url(#arrow)"/><rect x="785" y="3794" width="460" height="68" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1015.0" y="3820" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">NAV05 quedó interrumpido, no hubo primer</text><text x="1015.0" y="3845" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">token ni salida contractual</text><rect x="34" y="3181" width="1212" height="705" rx="5" fill="none" stroke="#8ca3b6"/><path d="M 22 3915 H 1258" stroke="#a9bbc9" stroke-dasharray="5 4"/><rect x="26" y="3920" width="1228" height="43" rx="6" fill="#e8edf2" stroke="#a9bbc9"/><text x="640.0" y="3946" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">ALTERNATIVA · No se cumplen los controles previos</text><rect x="785" y="3985" width="460" height="43" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="1015.0" y="4011" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">No se inicia la inferencia</text><rect x="22" y="2387" width="1236" height="1665" rx="5" fill="none" stroke="#8ca3b6"/><rect x="285" y="4076" width="460" height="68" rx="6" fill="#edf3f8" stroke="#bccddb"/><text x="515.0" y="4102" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">Comprueba terminación observada y recupera</text><text x="515.0" y="4127" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">la evidencia disponible</text><rect x="146.0" y="4168" width="488" height="64" rx="4" fill="white"/><text x="390.0" y="4189" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">25. Entrega registros, identidades y lagunas para</text><text x="390.0" y="4214" text-anchor="middle" fill="#17344b" font-size="18" font-weight="400">revisión</text><path d="M 640 4240 H 140" fill="none" stroke="#205a7f" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="35" y="4313" text-anchor="start" fill="#526878" font-size="16" font-weight="400">Flecha continua: orden o envío · Flecha discontinua: retorno · Lectura: de arriba abajo</text></g></svg>
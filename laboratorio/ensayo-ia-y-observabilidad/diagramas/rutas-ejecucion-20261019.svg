<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1035" viewBox="0 0 1200 1035" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Ejecución del modelo y presentación de resultados</title><desc id="descripcion">A: trabajador Rust y WebAssembly en el navegador, interrumpido por memoria antes del primer token. B: servicio y modelo nativos en el servidor. Servicios externos: el controlador Rust del SV recibe respuestas de una plataforma o proveedor; los datos conservados se presentan mediante el visor Rust y egui en WebAssembly. El visor no ejecuta el modelo.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087184"/></marker></defs><rect width="1200" height="1035" fill="#fff"/><g font-family="Arial, sans-serif" fill="#15394c"><text x="600" y="40" text-anchor="middle" font-size="27" font-weight="700">Ejecución del modelo y presentación de resultados</text>

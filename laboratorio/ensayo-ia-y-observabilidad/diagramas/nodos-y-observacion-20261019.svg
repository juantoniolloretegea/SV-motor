<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Tres nodos de inferencia: control y observación</title><desc id="descripcion">Las modalidades se distinguen por el control efectivo y la cobertura verificable. Las herramientas auxiliares no pertenecen a estos nodos.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087184"/></marker></defs><rect width="1100" height="650" fill="#fff"/><g font-family="Arial, sans-serif" fill="#15394c"><text x="550" y="38" text-anchor="middle" font-size="25" font-weight="700">Tres nodos de inferencia: control y observación</text>
<rect x="220" y="65" width="660" height="80" rx="10" fill="#eaf5f7" stroke="#527b91" stroke-width="1.6"/>
<text x="550" y="100" text-anchor="middle" font-size="20" font-weight="700">Dominio → nodo → modelo</text>
<text x="550" y="127" text-anchor="middle" font-size="18">Finalidad, condiciones y autorización identificadas</text>
<path d="M 550 145 V 170 H 185 V 193" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<path d="M 550 170 V 193" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<path d="M 550 170 H 915 V 193" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<rect x="30" y="195" width="310" height="185" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="185" y="242" text-anchor="middle" font-size="20" font-weight="700">Nodo 01</text>
<text x="185" y="269" text-anchor="middle" font-size="18">Modelo en el entorno del SV</text>
<text x="185" y="296" text-anchor="middle" font-size="18">Motor, pesos y recursos</text>
<text x="185" y="323" text-anchor="middle" font-size="18">bajo control institucional</text>
<text x="185" y="350" text-anchor="middle" font-size="18">Auditabilidad integral exigida</text>
<rect x="395" y="195" width="310" height="185" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="550" y="242" text-anchor="middle" font-size="20" font-weight="700">Nodo 02</text>
<text x="550" y="269" text-anchor="middle" font-size="18">Plataforma gestionada</text>
<text x="550" y="296" text-anchor="middle" font-size="18">Acceso organizado al modelo</text>
<text x="550" y="323" text-anchor="middle" font-size="18">Cobertura según los datos</text>
<text x="550" y="350" text-anchor="middle" font-size="18">que expone la plataforma</text>
<rect x="760" y="195" width="310" height="185" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="915" y="242" text-anchor="middle" font-size="20" font-weight="700">Nodo 03</text>
<text x="915" y="269" text-anchor="middle" font-size="18">Servicio externo del proveedor</text>
<text x="915" y="296" text-anchor="middle" font-size="18">Inferencia bajo su gobierno</text>
<text x="915" y="323" text-anchor="middle" font-size="18">Observación exterior del SV</text>
<text x="915" y="350" text-anchor="middle" font-size="18">y contadores comunicados</text>
<path d="M 185 380 V 411 H 550 V 438" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<path d="M 550 380 V 438" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<path d="M 915 380 V 411 H 550 V 438" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<rect x="125" y="440" width="850" height="100" rx="10" fill="#eaf5f7" stroke="#527b91" stroke-width="1.6"/>
<text x="550" y="471.5" text-anchor="middle" font-size="20" font-weight="700">Control y evidencias del SV</text>
<text x="550" y="498.5" text-anchor="middle" font-size="18">Solicitudes admitidas · originales · medidas con procedencia · incidencias</text>
<text x="550" y="525.5" text-anchor="middle" font-size="18">La cobertura se acredita por configuración; no se presume</text>
<text x="550" y="579" text-anchor="middle" font-size="17">La figura define modalidades y requisitos; no certifica una integración ya aceptada.</text>
<text x="550" y="604" text-anchor="middle" font-size="17">Traducción auxiliar y pruebas de hardware: finalidades separadas de la inferencia experta.</text>
</g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Safeguard: recorrido efectivo y cierre</title><desc id="descripcion">Respuesta inicial A0 y revisiones A1 a A3 sin mejora del error crítico A08. Diagnósticos separados. No se abrió B ni el examen.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087184"/></marker></defs><rect width="1100" height="730" fill="#fff"/><g font-family="Arial, sans-serif" fill="#15394c"><text x="550" y="38" text-anchor="middle" font-size="25" font-weight="700">Safeguard: recorrido efectivo y cierre</text>

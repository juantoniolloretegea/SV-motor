<rect x="150" y="190" width="800" height="90" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="550" y="230" text-anchor="middle" font-size="20" font-weight="700">A0 → A1 → A2 → A3</text>

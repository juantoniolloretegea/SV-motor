<path d="M 550 280 V 318" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<rect x="150" y="320" width="800" height="110" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="550" y="356.5" text-anchor="middle" font-size="20" font-weight="700">Custodia y cotejo exterior</text>

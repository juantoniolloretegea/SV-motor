<text x="290" y="276" text-anchor="middle" font-size="18">Respuestas, fuentes y errores críticos</text>
<text x="290" y="303" text-anchor="middle" font-size="18">Corrección con clave reservada</text>
<path d="M 290 320 V 358" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<rect x="60" y="360" width="460" height="145" rx="10" fill="#eaf5f7" stroke="#527b91" stroke-width="1.6"/>
<text x="290" y="400.5" text-anchor="middle" font-size="20" font-weight="700">Cierre de Instruct</text>
<text x="290" y="427.5" text-anchor="middle" font-size="18">7 aciertos · 2 errores críticos · 10 U</text>
<text x="290" y="454.5" text-anchor="middle" font-size="18">6 impedimentos técnicos separados</text>

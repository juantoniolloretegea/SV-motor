<text x="810" y="106.5" text-anchor="middle" font-size="20" font-weight="700">Thinking · expediente independiente</text>
<text x="810" y="133.5" text-anchor="middle" font-size="18">Consulta inicial y examen propios</text>
<text x="810" y="160.5" text-anchor="middle" font-size="18">Sin heredar resultados de Instruct</text>
<path d="M 810 175 V 358" fill="none" stroke="#087184" stroke-width="2.3" marker-end="url(#flecha)"/>
<rect x="580" y="360" width="460" height="145" rx="10" fill="#eaf5f7" stroke="#527b91" stroke-width="1.6"/>

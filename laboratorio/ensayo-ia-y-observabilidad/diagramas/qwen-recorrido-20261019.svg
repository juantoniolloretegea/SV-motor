<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="titulo descripcion"><title id="titulo">Qwen80: recepción documental y cierres separados</title><desc id="descripcion">Instruct conserva dos consultas recibidas y un examen incompleto, No apto por errores críticos. Thinking tiene un cierre operativo independiente sin puntuación global.</desc><defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#087184"/></marker></defs><rect width="1100" height="700" fill="#fff"/><g font-family="Arial, sans-serif" fill="#15394c"><text x="550" y="38" text-anchor="middle" font-size="25" font-weight="700">Qwen80: recepción documental y cierres separados</text>
<rect x="60" y="75" width="460" height="100" rx="10" fill="#f7fafc" stroke="#527b91" stroke-width="1.6"/>
<text x="290" y="106.5" text-anchor="middle" font-size="20" font-weight="700">Instruct · consulta documental</text>
<text x="290" y="133.5" text-anchor="middle" font-size="18">Biblioteca identificada y MCP</text>
<text x="290" y="160.5" text-anchor="middle" font-size="18">Dos recorridos instrumentales recibidos</text>

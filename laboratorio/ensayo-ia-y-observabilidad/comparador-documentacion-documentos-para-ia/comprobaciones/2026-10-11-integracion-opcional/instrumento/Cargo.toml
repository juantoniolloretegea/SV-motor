[package]
name = "sv-bsd-integracion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
sv-administracion-documental = { path = "dependencias/administracion-documental-rust-20261010" }
sv-biblioteca-documental = { path = "dependencias/biblioteca-documental-rust-20261009", features = ["administracion-humana"] }
speccheck-core = { path = "dependencias/speccheck-core-0.4.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
pest = "=2.8.6"
pest_derive = "=2.8.6"
pest_generator = "=2.8.6"
pest_meta = "=2.8.6"

[profile.dev]
debug = 0
incremental = false

[workspace]
exclude = ["dependencias/administracion-documental-rust-20261010", "dependencias/representacion-pdf-rust-20261011", "dependencias/mcp-pdf-extraccion-20261009/lector", "dependencias/biblioteca-documental-rust-20261009", "dependencias/mcp-mdbook-20261007", "dependencias/speccheck-core-0.4.1"]

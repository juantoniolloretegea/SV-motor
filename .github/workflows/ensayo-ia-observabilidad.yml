name: EIO diagnóstico de transporte EIO-TR-01
on:
  workflow_dispatch:
    inputs:
      commit:
        description: SHA completo del precompromiso autorizado
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: eio-github-01
  cancel-in-progress: false
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SOLICITADO: ${{ inputs.commit }}
    steps:
      - name: Verificar identidad y presupuesto extraordinario
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == juantoniolloretegea/SV-motor ]]
          [[ "$SOLICITADO" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" == "$SOLICITADO" ]]
          (( GITHUB_RUN_NUMBER == 4 && GITHUB_RUN_ATTEMPT == 1 ))
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: laboratorio/ensayo-ia-y-observabilidad
      - name: Diagnóstico acotado de la primera redirección
        working-directory: laboratorio/ensayo-ia-y-observabilidad
        shell: bash
        env:
          EIO_DIAGNOSTICO_AUTORIZADO: EIO-TR-01
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOLICITADO" ]]
          jq -e '.adquisicion_habilitada == false and .ensayo_habilitado == false' pruebas/estado-acceso.json >/dev/null
          bash pruebas/diagnosticar-transporte.sh
      - name: Referencia de custodia
        if: always()
        shell: bash
        run: |
          printf 'EIO-TR-01; run=%s; intento=%s; commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOLICITADO" >> "$GITHUB_STEP_SUMMARY"

